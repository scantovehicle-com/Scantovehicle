<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce">
<title>Contact Owner</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef5ff 0%,#f7f9fc 100%);color:#172033;display:flex;justify-content:center;align-items:center;padding:18px}
.card{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:26px 20px 22px;box-shadow:0 12px 35px rgba(15,40,80,.14);border:1px solid #e5ebf3}
h1{margin:0;text-align:center;font-size:25px;line-height:1.2}
.subtitle{text-align:center;color:#667085;font-size:14px;margin:9px 0 22px}
.vehicle{text-align:center;font-size:21px;font-weight:800;letter-spacing:.6px;margin-bottom:5px}
.owner{text-align:center;color:#475467;font-size:17px;font-weight:600;margin-bottom:22px}
.contact{border:1px solid #e6eaf0;border-radius:17px;padding:15px;margin:13px 0;background:#fafbfd}
.contact-title{font-size:14px;font-weight:800;letter-spacing:.3px;margin-bottom:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;color:#fff;text-decoration:none;border-radius:13px;font-size:18px;font-weight:800;box-shadow:0 5px 12px rgba(0,0,0,.10)}
.owner-btn{background:#0b63ce}
.emergency-btn{background:#c62828;white-space:nowrap;font-size:16px;padding:0 6px;letter-spacing:.1px}
.privacy{margin:18px 4px 0;padding:11px 12px;border-radius:12px;background:#f1f5f9;color:#64748b;font-size:12px;line-height:1.45;text-align:center}
.footer{text-align:center;margin-top:15px;color:#98a2b3;font-size:11px}
</style>
</head>
<body>
<main class="card">
<h1>Contact Owner</h1>
<div class="subtitle">Choose the contact you need</div>

<div class="owner">Sandeep</div>
<section class="contact">
<div class="contact-title">OWNER</div>
<a class="btn owner-btn" href="tel:+919550330101">CALL OWNER</a>
</section>
<section class="contact">
<div class="contact-title">EMERGENCY CONTACT</div>
<a class="btn emergency-btn" href="tel:+919550330102">CALL EMERGENCY CONTACT</a>
</section>
<div class="privacy">Phone numbers are hidden for privacy. Tap a button to place the call.</div>
<div class="footer">Vehicle contact service</div>
</main>
</body>
</html>
