<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call to Vehicle Owner</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:28px;text-align:center}
.card{max-width:420px;margin:30px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 4px 18px #0002}
h1{font-size:24px;margin:0 0 18px}
.vehicle{font-size:20px;font-weight:bold;margin:10px 0 6px}
.owner{font-size:18px;font-weight:600;margin:0 0 18px;color:#333}
.contact{text-align:left;border-radius:12px;padding:14px 16px;margin:12px 0;background:#f7f7f7}
.contact-title{font-size:16px;font-weight:bold;margin-bottom:6px}
.number{font-size:18px;font-weight:bold;letter-spacing:.3px}
.btn{display:block;color:#fff;text-decoration:none;padding:16px;border-radius:12px;font-size:20px;font-weight:bold;margin-top:10px}
.owner-btn{background:#0b63ce}
.emergency-btn{background:#c62828}
.small{color:#666;margin-top:18px;font-size:13px}
</style></head>
<body><div class="card">
<h1>Call to Vehicle Owner</h1>
<div class="vehicle">AP 29 BC 0141</div><div class="owner">Rajashekar</div>
<div class="contact"><div class="contact-title">VEHICLE OWNER</div><div class="number">+919000983372</div>
<a class="btn owner-btn" href="tel:+919000983372">CALL VEHICLE OWNER</a></div>
<div class="contact"><div class="contact-title">EMERGENCY CONTACT</div><div class="number">+917680092691</div>
<a class="btn emergency-btn" href="tel:+917680092691">CALL EMERGENCY CONTACT</a></div>
<div class="small">Two separate contact numbers are available on this page.</div>
</div></body></html>
